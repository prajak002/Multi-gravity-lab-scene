<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi-Gravity Arena — A/B</title>
  <link rel="stylesheet" href="/src/ui/arena.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="ui">
    <div id="seam"></div>
    <div id="titles"></div>
    <!-- Panel and picker share one flex column, so a long caption can never
         overlap the picker however tall it grows. -->
    <div id="left">
      <div id="panel"><h1>loading…</h1></div>
      <!-- Three levels, because the question has three parts: which body sets
           the gravity, which place sets the ground, which motion sets what the
           robot is trying to do there. -->
      <div id="browse">
        <div id="tabs"></div>
        <div id="places"></div>
        <div id="motions"></div>
      </div>
    </div>
    <div id="hint">drag to orbit · scroll to zoom<br>space to pause · ← → step a frame</div>
    <div id="bar">
      <button id="play">❚❚</button>
      <button id="mode">SIDE BY SIDE</button>
      <span id="sepwrap"><label for="sep">APART</label>
        <input id="sep" type="range" min="0" max="4" step="0.1" value="1.8" />
        <span id="sepval">1.8 m</span></span>
      <input id="scrub" type="range" min="0" max="1000" value="0" />
      <label for="rate">RATE</label>
      <input id="rate" type="range" min="0.1" max="2" step="0.05" value="1" />
      <span id="rateval">1.00×</span>
      <button id="g1rate" title="">G1 REAL-TIME</button>
    </div>
  </div>
  <script type="module">
    import { startArena } from '/src/ui/Arena.js';
    startArena(document.getElementById('stage'), document.getElementById('ui'))
      // Exposed deliberately: lets a headless check assert on real scene state
      // (are both robots visible, how far apart) instead of eyeballing pixels.
      .then((a) => { window.__arena = a; })
      .catch((e) => {
        document.getElementById('panel').innerHTML =
          `<h1>Failed to start</h1><p class="blurb">${e.message}</p>`;
        console.error(e);
      });
  </script>
</body>
</html>
